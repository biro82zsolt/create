
{% extends "performance/base.html" %}

{% block title %}{{ t("assessment_start_title") }}{% endblock %}

{% block content %}

<div class="card">

    <h1>{{ t("assessment_start_title") }}</h1>

    <p>
        {{ t("assessment_start_description") }}
    </p>

    <form method="post"
          action="{{ url_for('performance.assessment_start') }}">

        <div style="margin-bottom: 20px;">
            <label for="coach">
                <strong>{{ t("assessment_coach_label") }}</strong>
            </label>

            <select
                id="coach"
                name="coach_id"
                required
                style="width:100%; padding:11px; margin-top:6px;"
            >
                <option value="">
                    {{ t("assessment_select_coach") }}
                </option>

                {% for coach in coaches %}
                    <option value="{{ coach.id }}">
                        {{ coach.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label for="team">
                <strong>{{ t("team") }}</strong>
            </label>

            <select
                id="team"
                name="team_id"
                style="width:100%; padding:11px; margin-top:6px;"
            >
                <option value="" selected disabled>
                    {{ t("assessment_select_team") }}
                </option>

                {% for team in teams %}
                    <option value="{{ team.id }}">
                        {{ team.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label for="period">
                <strong>{{ t("assessment_period") }}</strong>
            </label>

            <select
                id="period"
                name="period_id"
                required
                style="width:100%; padding:11px; margin-top:6px;"
            >
                <option value="">
                    {{ t("assessment_select_period") }}
                </option>

                {% for period in periods %}
                    <option value="{{ period.id }}">
                        {{ period.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 24px;">
            <label for="player">
                <strong>{{ t("player") }}</strong>
            </label>

            <select
                id="player"
                name="player_id"
                required
                disabled
                style="width:100%; padding:11px; margin-top:6px;"
            >
                <option value="">
                    {{ t("assessment_select_team_first") }}
                </option>

                {% for player in players %}
                    {% if player.active %}
                        <option
                            value="{{ player.id }}"
                            data-team="{{ player.team_id or '' }}"
                        >
                            {{ player.full_name }}

                            {% if player.team %}
                                — {{ player.team.name }}
                            {% endif %}
                        </option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <button type="submit">
            {{ t("assessment_start_button") }}
        </button>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const teamSelect = document.getElementById("team");
    const playerSelect = document.getElementById("player");

    const playerOptions = Array.from(
        playerSelect.querySelectorAll("option[data-team]")
    );

    function filterPlayers() {

        const selectedTeamId = teamSelect.value;

        playerSelect.value = "";

        if (!selectedTeamId) {
            playerSelect.disabled = true;
            playerSelect.options[0].textContent =
                {{ t("assessment_select_team_first") | tojson }};
        } else {
            playerSelect.disabled = false;
            playerSelect.options[0].textContent =
                {{ t("assessment_select_player") | tojson }};
        }

        playerOptions.forEach(function (option) {

            const playerTeamId = option.dataset.team;

            option.hidden = (
                !selectedTeamId ||
                playerTeamId !== selectedTeamId
            );

        });

    }

    teamSelect.addEventListener("change", filterPlayers);

    filterPlayers();

});
</script>

{% endblock %}
