
{% extends "performance/base.html" %}

{% block title %}{{ t("coach_login") }}{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;margin:40px auto;">

    <h1>{{ t("coach_login") }}</h1>

    <form method="post">

        <label for="username">{{ t("username") }}</label>
        <input
            id="username"
            name="username"
            required
            autocomplete="username"
            style="width:100%;margin:8px 0 16px;"
        >

        <label for="password">{{ t("password") }}</label>
        <input
            id="password"
            type="password"
            name="password"
            required
            autocomplete="current-password"
            style="width:100%;margin:8px 0 16px;"
        >

        <button type="submit">{{ t("login") }}</button>

    </form>

    <p>
        <a href="{{ url_for('admin_login') }}">
            {{ t("admin_login") }}
        </a>
    </p>

</div>
{% endblock %}
