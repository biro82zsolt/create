services:
  - type: web
    name: performance
    env: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: COACH_USERNAME
        sync: false

      - key: COACH_PASSWORD_HASH
        sync: false

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD_HASH
        sync: false